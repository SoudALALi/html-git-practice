<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عن الصفحة</title>
  <style>
    /* إعادة تعيين بسيطة */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Tahoma', 'Arial', system-ui, sans-serif;
      background: #f6f9fc;
      color: #1a2b3c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* بطاقة القسم – نظيفة وواضحة */
    section {
      max-width: 640px;
      width: 100%;
      background: #ffffff;
      border-radius: 1.8rem;
      padding: 2.8rem 2.2rem;
      box-shadow: 0 18px 35px -12px rgba(0, 30, 60, 0.15),
                  0 4px 12px rgba(0, 0, 0, 0.02);
      border: 1px solid #eaf0f8;
      transition: transform 0.2s ease;
    }

    section:hover {
      transform: translateY(-3px);
    }

    /* عنوان القسم */
    h2 {
      font-size: 2rem;
      font-weight: 650;
      color: #0b2a4a;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 3px solid #2d7ff9;
      display: inline-block;
      letter-spacing: -0.3px;
    }

    /* الفقرة */
    p {
      font-size: 1.2rem;
      line-height: 1.8;
      color: #2c3f57;
      font-weight: 400;
      background: #f8fbff;
      padding: 1.6rem 1.8rem;
      border-radius: 1.25rem;
      border-right: 5px solid #2d7ff9;
      margin-top: 0.5rem;
      box-shadow: inset 0 0 0 1px rgba(45, 127, 249, 0.08);
    }

    /* تحسينات للشاشات الصغيرة */
    @media (max-width: 500px) {
      section {
        padding: 1.8rem 1.3rem;
      }
      h2 {
        font-size: 1.6rem;
      }
      p {
        font-size: 1rem;
        padding: 1.2rem 1.2rem;
      }
    }
  </style>
</head>
<body>
  <section>
    <h2>عن الصفحة</h2>
    <p>هذه الصفحة مخصصة للتدريب على استخدام Git وGitHub في إدارة المشاريع. وتم تعديلها في الواجب الثاني.</p>
  </section>
</body>
</html>
